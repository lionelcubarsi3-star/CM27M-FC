
name: Build CM27 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 -type f -iname '*.zip' \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e
          GRADLEW=$(find extracted -type f \
            -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No Gradle wrapper found in ZIP"
            echo "Check whether this ZIP contains the Android source project."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" \
            >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CM27-Android-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
